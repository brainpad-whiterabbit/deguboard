<svg xmlns="http://www.w3.org/2000/svg" class="next" viewBox="0 0 900 250" role="img" aria-label="エージェントが dg next を呼ぶと、dg は事実（チケット・ブランチ・PR・Run・検査・段）から段階を求めて次の一手を返す。エージェントはその一手を行い、また聞く。マージの承認など人だけが決めることは、人に聞く手として返る">
  <style>
    .next .bg { fill: #ffffff; }
    .next text { font-size: 13px; fill: #1f2328; font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .next text.sub, .next text.lab { font-size: 11px; fill: #59636e; }
    .next text.acc { fill: #0969da; font-weight: 600; }
    .next .box { fill: #f6f8fa; stroke: #1f2328; stroke-opacity: .55; stroke-width: 1; }
    .next .box.acc { stroke: #0969da; stroke-opacity: 1; stroke-width: 2; }
    .next .ln { stroke: #1f2328; stroke-width: 1.3; fill: none; }
    .next .ln.dash { stroke-dasharray: 5 4; }
    .next .head { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .next .bg { fill: #0d1117; }
      .next text { fill: #e6edf3; }
      .next text.sub, .next text.lab { fill: #9198a1; }
      .next text.acc { fill: #4493f8; }
      .next .box { fill: #151b23; stroke: #e6edf3; }
      .next .box.acc { stroke: #4493f8; }
      .next .ln { stroke: #e6edf3; }
      .next .head { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="next-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="250"/>
  <rect class="box" x="20" y="90" width="170" height="64" rx="8"/>
  <text x="105" y="118" text-anchor="middle">エージェント</text>
  <text x="105" y="138" text-anchor="middle" class="sub">Skill・dg guide を読む</text>

  <rect class="box acc" x="330" y="70" width="230" height="104" rx="8"/>
  <text x="445" y="96" text-anchor="middle" class="acc">dg next</text>
  <text x="445" y="118" text-anchor="middle" class="sub">事実から段階をそのつど求める</text>
  <text x="445" y="136" text-anchor="middle" class="sub">（保存しない）</text>
  <text x="445" y="158" text-anchor="middle" class="sub">品質ゲートは dg gate が判定</text>

  <rect class="box" x="690" y="20" width="190" height="200" rx="8"/>
  <text x="785" y="44" text-anchor="middle">事実</text>
  <text x="785" y="72" text-anchor="middle" class="sub">チケットの状態と依存</text>
  <text x="785" y="96" text-anchor="middle" class="sub">作業ブランチと push</text>
  <text x="785" y="120" text-anchor="middle" class="sub">PR（draft・ready・マージ）</text>
  <text x="785" y="144" text-anchor="middle" class="sub">Run と見直しの結果</text>
  <text x="785" y="168" text-anchor="middle" class="sub">検査の結果</text>
  <text x="785" y="192" text-anchor="middle" class="sub">段（high・low・free）</text>

  <line class="ln" x1="190" y1="108" x2="328" y2="108" marker-end="url(#next-arrow)"/>
  <text x="259" y="100" text-anchor="middle" class="lab">次は？</text>
  <line class="ln" x1="560" y1="122" x2="688" y2="122" marker-end="url(#next-arrow)"/>
  <text x="624" y="114" text-anchor="middle" class="lab">読むだけ</text>
  <line class="ln" x1="328" y1="140" x2="192" y2="140" marker-end="url(#next-arrow)"/>
  <text x="259" y="158" text-anchor="middle" class="lab">次の 1 手</text>

  <text x="20" y="200" class="lab">1 手ごとに、呼ぶコマンド・サブエージェントに渡す文（brief）・人に聞くことが付く</text>
  <text x="20" y="220" class="lab">マージの承認のように人だけが決めることは、人に聞く手として返る</text>
  <path class="ln dash" d="M 60 90 C 60 30, 160 30, 160 88" marker-end="url(#next-arrow)"/>
  <text x="110" y="24" text-anchor="middle" class="lab">行ったら、また聞く</text>
</svg>
