<svg xmlns="http://www.w3.org/2000/svg" class="next" viewBox="0 0 900 250" role="img" aria-label="When the agent calls dg next, dg derives the stage from facts (tickets, work branches, PRs, Runs, Plans, gate level) and returns one next step; the agent carries out that step and asks again. Decisions only a person makes, such as merge approval, are returned as a question to a person">
  <style>
    .next .bg { fill: #ffffff; }
    .next text { font-size: 13px; fill: #1f2328; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .next text.sub, .next text.lab { font-size: 11px; fill: #59636e; }
    .next text.acc { fill: #0969da; font-weight: 600; }
    .next .box { fill: #f6f8fa; stroke: #1f2328; stroke-opacity: .55; stroke-width: 1; }
    .next .box.acc { stroke: #0969da; stroke-opacity: 1; stroke-width: 2; }
    .next .ln { stroke: #1f2328; stroke-width: 1.3; fill: none; }
    .next .ln.dash { stroke-dasharray: 5 4; }
    .next .head { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .next .bg { fill: #0d1117; }
      .next text { fill: #e6edf3; }
      .next text.sub, .next text.lab { fill: #9198a1; }
      .next text.acc { fill: #4493f8; }
      .next .box { fill: #151b23; stroke: #e6edf3; }
      .next .box.acc { stroke: #4493f8; }
      .next .ln { stroke: #e6edf3; }
      .next .head { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="next-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="250"/>
  <rect class="box" x="20" y="90" width="170" height="64" rx="8"/>
  <text x="105" y="118" text-anchor="middle">Agent</text>
  <text x="105" y="138" text-anchor="middle" class="sub">reads Skills and dg guide</text>

  <rect class="box acc" x="330" y="70" width="230" height="104" rx="8"/>
  <text x="445" y="96" text-anchor="middle" class="acc">dg next</text>
  <text x="445" y="118" text-anchor="middle" class="sub">derives the stage from facts</text>
  <text x="445" y="136" text-anchor="middle" class="sub">(the stage is not stored)</text>
  <text x="445" y="158" text-anchor="middle" class="sub">the gate is judged by dg gate</text>

  <rect class="box" x="690" y="20" width="190" height="200" rx="8"/>
  <text x="785" y="44" text-anchor="middle">Facts</text>
  <text x="785" y="72" text-anchor="middle" class="sub">ticket state and dependencies</text>
  <text x="785" y="96" text-anchor="middle" class="sub">work branch and pushes</text>
  <text x="785" y="120" text-anchor="middle" class="sub">PR (draft, ready, merged)</text>
  <text x="785" y="144" text-anchor="middle" class="sub">Runs and review results</text>
  <text x="785" y="168" text-anchor="middle" class="sub">Plan approval and waits</text>
  <text x="785" y="192" text-anchor="middle" class="sub">gate level (high, low, free)</text>

  <line class="ln" x1="190" y1="108" x2="328" y2="108" marker-end="url(#next-arrow)"/>
  <text x="259" y="100" text-anchor="middle" class="lab">what next?</text>
  <line class="ln" x1="560" y1="122" x2="688" y2="122" marker-end="url(#next-arrow)"/>
  <text x="624" y="114" text-anchor="middle" class="lab">reads only</text>
  <line class="ln" x1="328" y1="140" x2="192" y2="140" marker-end="url(#next-arrow)"/>
  <text x="259" y="158" text-anchor="middle" class="lab">one step</text>

  <text x="20" y="200" class="lab">Each step comes with the command to call, the brief for a subagent, and the questions to ask a person.</text>
  <text x="20" y="220" class="lab">Decisions only a person makes (merge approval, release, stopping) come back as a step that asks a person.</text>
  <path class="ln dash" d="M 60 90 C 60 30, 160 30, 160 88" marker-end="url(#next-arrow)"/>
  <text x="110" y="24" text-anchor="middle" class="lab">do it, then ask again</text>
</svg>
