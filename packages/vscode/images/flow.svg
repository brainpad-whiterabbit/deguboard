<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="fig-title fig-desc">
  <!-- README の flow.png の元。Chromium（リポジトリの Playwright）で、viewBox と同じ 1200×650 の画面に倍率 2 で描いて撮った（Inter と Space Grotesk は Google Fonts から読んだ） -->
  <title id="fig-title">deguboard development flow</title>
  <desc id="fig-desc">You and agents work in a loop. An agent turns your idea into small tickets, which you approve. An agent orders them into a plan, which you approve. In the Iteration, several agents work on unblocked tickets in parallel; another agent reviews each one at the quality gate, fails go back to work, and you approve each merge. An agent reviews the whole repository and you approve the release. An agent reports the actuals, you choose the improvements, and they become the next tickets.</desc>
  <style>
    text { font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #18202B; }
    .t-title, .t-iter, .t-node, .t-chip, .t-loop, .t-actor-you, .t-actor-agent, .t-tk-id, .t-dn, .t-dn-ready, .t-kpi { font-family: "Space Grotesk", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .bg { fill: #FFFFFF; }
    .t-title { font-weight: 600; font-size: 19px; }
    .t-iter { font-weight: 700; font-size: 22px; fill: #2F55C8; }
    .t-node { font-weight: 600; font-size: 14px; fill: #2F55C8; }
    .t-body { font-size: 13px; fill: #5B6573; }
    .t-small { font-size: 11.5px; fill: #5B6573; }
    .t-stamp { font-size: 12px; font-weight: 600; fill: #B8700F; }
    .t-chip { font-size: 11px; font-weight: 600; fill: #2F55C8; }
    .t-rework { font-size: 11.5px; font-weight: 600; fill: #C2413A; }
    .t-loop { font-size: 15px; font-weight: 600; fill: #2E7D6B; }
    .t-band { font-size: 13px; fill: #2E7D6B; }
    .t-actor-you { font-size: 20px; font-weight: 700; fill: #B8700F; }
    .t-actor-agent { font-size: 20px; font-weight: 700; fill: #2F55C8; }
    .t-actor { font-size: 13px; fill: #18202B; }
    .ticket { fill: #FFFFFF; stroke: #C9D0D9; }
    .ticket-line { stroke: #C9D0D9; stroke-width: 2; stroke-linecap: round; }
    .ticket-box { fill: none; stroke: #2F55C8; stroke-width: 1.3; }
    .box { fill: #FFFFFF; stroke: #C9D0D9; }
    .ring { fill: #E3E9FB; stroke: none; opacity: .6; }
    .cycle { stroke: #2F55C8; stroke-width: 3; fill: none; }
    .node { fill: #FFFFFF; stroke: #2F55C8; stroke-width: 2; }
    .chip { fill: #FFFFFF; stroke: #2F55C8; stroke-width: 1; }
    .stamp { fill: #FBEFD9; stroke: #B8700F; stroke-width: 1.5; }
    .flow { stroke: #18202B; stroke-opacity: .55; stroke-width: 2; fill: none; }
    .rework { stroke: #C2413A; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    .loop { stroke: #2E7D6B; stroke-width: 3; fill: none; }
    .band { fill: #DDEFEA; }
    .ah-flow { fill: #18202B; fill-opacity: .55; }
    .ah-agent { fill: #2F55C8; }
    .ah-rework { fill: #C2413A; }
    .ah-loop { fill: #2E7D6B; }
    .label-bg { fill: #FFFFFF; }
    .tk-front { stroke: #2F55C8; stroke-opacity: .5; }
    .tk-id { fill: #2F55C8; }
    .t-tk-id { font-size: 9px; font-weight: 700; fill: #FFFFFF; }
    .t-tk-title { font-size: 10px; font-weight: 600; fill: #18202B; }
    .t-tk-label { font-size: 7.5px; font-weight: 600; letter-spacing: .08em; fill: #5B6573; }
    .t-tk { font-size: 9.5px; fill: #18202B; }
    .dep { stroke: #2F55C8; stroke-opacity: .55; stroke-width: 1.4; fill: none; }
    .dn { fill: #FFFFFF; stroke: #2F55C8; stroke-width: 1.3; }
    .dn-ready { fill: #2F55C8; }
    .t-dn, .t-dn-ready { font-size: 9px; font-weight: 600; }
    .t-dn { fill: #2F55C8; }
    .t-dn-ready { fill: #FFFFFF; }
    .mini { fill: #F5F7F9; stroke: #C9D0D9; }
    .axis { stroke: #C9D0D9; stroke-width: 1; }
    .rbar { fill: #E3E9FB; stroke: #2F55C8; stroke-opacity: .4; }
    .rbar-now { fill: #2F55C8; }
    .trend { stroke: #2E7D6B; stroke-width: 1.8; fill: none; stroke-linejoin: round; }
    .trend-dot { fill: #2E7D6B; }
    .t-kpi { font-size: 13px; font-weight: 700; fill: #2E7D6B; }
    .t-kpi-label { font-size: 9.5px; fill: #5B6573; }
    .h-ic { fill: #B8700F; }
    .a-ic { fill: #2F55C8; }
    .a-eye { fill: #FFFFFF; }
    .a-ant { stroke: #2F55C8; stroke-width: 2; stroke-linecap: round; }
    .hb { fill: #FFFFFF; stroke: #B8700F; stroke-width: 1.5; }
    .ab { fill: #E3E9FB; stroke: #2F55C8; stroke-width: 1.5; }
    .actor-card-you { fill: #FBEFD9; }
    .actor-card-agent { fill: #E3E9FB; }
  </style>
  <defs>
    <marker id="m-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-flow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-agent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-agent" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-rework" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-rework" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-loop" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-loop" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-dep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-agent" d="M0,0 L10,5 L0,10 z"/></marker>
    <symbol id="human" viewBox="0 0 24 24">
      <circle class="h-ic" cx="12" cy="7.5" r="4.5"/>
      <path class="h-ic" d="M3.5,23 C3.5,16 8,13.5 12,13.5 C16,13.5 20.5,16 20.5,23 Z"/>
    </symbol>
    <symbol id="agent" viewBox="0 0 24 24">
      <line class="a-ant" x1="12" y1="2.5" x2="12" y2="6.5"/>
      <circle class="a-ic" cx="12" cy="2.5" r="2"/>
      <rect class="a-ic" x="3" y="6.5" width="18" height="15" rx="5"/>
      <circle class="a-eye" cx="8.6" cy="13.5" r="2"/>
      <circle class="a-eye" cx="15.4" cy="13.5" r="2"/>
    </symbol>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="650"/>

  <!-- Return arc: retrospective → backlog -->
  <path class="loop" d="M1110,150 V110 Q1110,60 1060,60 H180 Q130,60 130,110 V138" marker-end="url(#m-loop)"/>
  <rect class="label-bg" x="440" y="46" width="360" height="28"/>
  <text class="t-loop" x="620" y="66" text-anchor="middle">Improvements become the next tickets</text>

  <!-- 1. Backlog -->
  <g>
    <rect class="ticket" x="62" y="144" width="160" height="124" rx="6"/>
    <rect class="ticket" x="56" y="150" width="160" height="124" rx="6"/>
    <rect class="ticket tk-front" x="50" y="156" width="160" height="124" rx="6"/>
    <rect class="tk-id" x="60" y="164" width="24" height="14" rx="3"/>
    <text class="t-tk-id" x="72" y="174.5" text-anchor="middle">t15</text>
    <text class="t-tk-title" x="90" y="175">Export as CSV</text>
    <line class="axis" x1="60" y1="185" x2="200" y2="185"/>
    <text class="t-tk-label" x="60" y="198">ACCEPTANCE CRITERIA</text>
    <rect class="ticket-box" x="60" y="204" width="8" height="8" rx="2"/><text class="t-tk" x="74" y="211.5">Exports every column</text>
    <rect class="ticket-box" x="60" y="218" width="8" height="8" rx="2"/><text class="t-tk" x="74" y="225.5">Escapes commas</text>
    <rect class="ticket-box" x="60" y="232" width="8" height="8" rx="2"/><text class="t-tk" x="74" y="239.5">Opens in a spreadsheet</text>
    <line class="axis" x1="60" y1="249" x2="200" y2="249"/>
    <text class="t-tk-label" x="60" y="266">DEPENDS ON</text>
    <rect class="dn" x="122" y="257" width="26" height="13" rx="3"/><text class="t-dn" x="135" y="266.5" text-anchor="middle">t12</text>
    <rect class="dn" x="152" y="257" width="26" height="13" rx="3"/><text class="t-dn" x="165" y="266.5" text-anchor="middle">t13</text>
  </g>
  <g><circle class="ab" cx="208" cy="158" r="15"/><use href="#agent" x="198" y="148" width="20" height="20"/></g>
  <text class="t-title" x="50" y="298">Backlog</text>
  <text class="t-body" x="50" y="320">An agent turns your idea</text>
  <text class="t-body" x="50" y="338">into small tickets with</text>
  <text class="t-body" x="50" y="356">acceptance criteria</text>
  <g>
    <rect class="stamp" x="50" y="380" width="128" height="30" rx="15"/>
    <circle class="hb" cx="65" cy="395" r="11"/><use href="#human" x="57" y="387" width="16" height="16"/>
    <text class="t-stamp" x="82" y="399">You approve</text>
  </g>

  <path class="flow" d="M226,230 H262" marker-end="url(#m-flow)"/>

  <!-- 2. Plan -->
  <rect class="box" x="270" y="150" width="150" height="120" rx="8"/>
  <g>
    <path class="dep" d="M312,171 C320,171 320,180 325,180" marker-end="url(#m-dep)"/>
    <path class="dep" d="M312,190 C320,190 320,180 325,180" marker-end="url(#m-dep)"/>
    <path class="dep" d="M312,209 H325" marker-end="url(#m-dep)"/>
    <path class="dep" d="M358,180 C366,180 366,194 371,194" marker-end="url(#m-dep)"/>
    <path class="dep" d="M358,209 C366,209 366,194 371,194" marker-end="url(#m-dep)"/>
    <rect class="dn-ready" x="282" y="164" width="30" height="14" rx="3"/><text class="t-dn-ready" x="297" y="174.5" text-anchor="middle">t12</text>
    <rect class="dn-ready" x="282" y="183" width="30" height="14" rx="3"/><text class="t-dn-ready" x="297" y="193.5" text-anchor="middle">t13</text>
    <rect class="dn-ready" x="282" y="202" width="30" height="14" rx="3"/><text class="t-dn-ready" x="297" y="212.5" text-anchor="middle">t14</text>
    <rect class="dn" x="328" y="173" width="30" height="14" rx="3"/><text class="t-dn" x="343" y="183.5" text-anchor="middle">t15</text>
    <rect class="dn" x="328" y="202" width="30" height="14" rx="3"/><text class="t-dn" x="343" y="212.5" text-anchor="middle">t16</text>
    <rect class="dn" x="374" y="187" width="30" height="14" rx="3"/><text class="t-dn" x="389" y="197.5" text-anchor="middle">t17</text>
  </g>
  <g><circle class="ab" cx="414" cy="152" r="15"/><use href="#agent" x="404" y="142" width="20" height="20"/></g>
  <text class="t-title" x="286" y="246">Plan</text>
  <text class="t-small" x="286" y="262">In dependency order</text>
  <text class="t-body" x="270" y="298">Agents start only</text>
  <text class="t-body" x="270" y="316">after your approval</text>
  <g>
    <rect class="stamp" x="270" y="334" width="128" height="30" rx="15"/>
    <circle class="hb" cx="285" cy="349" r="11"/><use href="#human" x="277" y="341" width="16" height="16"/>
    <text class="t-stamp" x="302" y="353">You approve</text>
  </g>

  <path class="flow" d="M432,230 C460,230 470,200 520,186" marker-end="url(#m-flow)"/>

  <!-- 3. The Iteration loop -->
  <circle class="ring" cx="620" cy="290" r="170"/>
  <path class="cycle" d="M652,159 A135,135 0 0 1 742,333" marker-end="url(#m-agent)"/>
  <path class="cycle" d="M705,395 A135,135 0 0 1 535,395" marker-end="url(#m-agent)"/>
  <path class="cycle" d="M498,333 A135,135 0 0 1 588,159" marker-end="url(#m-agent)"/>

  <text class="t-iter" x="620" y="250" text-anchor="middle">Iteration</text>
  <text class="t-small" x="620" y="270" text-anchor="middle">Agents work on unblocked</text>
  <text class="t-small" x="620" y="286" text-anchor="middle">tickets in parallel</text>
  <g><circle class="ab" cx="578" cy="314" r="15"/><use href="#agent" x="568" y="304" width="20" height="20"/></g>
  <g><circle class="ab" cx="620" cy="314" r="15"/><use href="#agent" x="610" y="304" width="20" height="20"/></g>
  <g><circle class="ab" cx="662" cy="314" r="15"/><use href="#agent" x="652" y="304" width="20" height="20"/></g>
  <rect class="chip" x="560" y="336" width="36" height="20" rx="10"/><text class="t-chip" x="578" y="350" text-anchor="middle">t12</text>
  <rect class="chip" x="602" y="336" width="36" height="20" rx="10"/><text class="t-chip" x="620" y="350" text-anchor="middle">t13</text>
  <rect class="chip" x="644" y="336" width="36" height="20" rx="10"/><text class="t-chip" x="662" y="350" text-anchor="middle">t14</text>

  <rect class="node" x="566" y="140" width="108" height="32" rx="16"/>
  <text class="t-node" x="620" y="161" text-anchor="middle">Work</text>
  <text class="t-small" x="620" y="128" text-anchor="middle">Each on its own branch</text>

  <rect class="node" x="690" y="336" width="148" height="32" rx="16"/>
  <circle class="ab" cx="708" cy="352" r="12"/><use href="#agent" x="700" y="344" width="16" height="16"/>
  <text class="t-node" x="776" y="357" text-anchor="middle">Quality gate</text>
  <text class="t-small" x="764" y="388" text-anchor="middle">Checks, and a review</text>
  <text class="t-small" x="764" y="403" text-anchor="middle">by another agent</text>

  <rect class="node" x="420" y="336" width="108" height="32" rx="16"/>
  <text class="t-node" x="474" y="357" text-anchor="middle">Merge</text>
  <g>
    <rect class="stamp" x="410" y="380" width="128" height="30" rx="15"/>
    <circle class="hb" cx="425" cy="395" r="11"/><use href="#human" x="417" y="387" width="16" height="16"/>
    <text class="t-stamp" x="442" y="399">You approve</text>
  </g>

  <path class="rework" d="M716,334 Q700,240 650,180" marker-end="url(#m-rework)"/>
  <text class="t-rework" x="706" y="238">fails → fix</text>

  <path class="flow" d="M796,290 H840" marker-end="url(#m-flow)"/>

  <!-- 4. Release -->
  <rect class="box" x="848" y="250" width="150" height="80" rx="8"/>
  <g><circle class="ab" cx="992" cy="252" r="15"/><use href="#agent" x="982" y="242" width="20" height="20"/></g>
  <text class="t-title" x="864" y="282">Release</text>
  <text class="t-small" x="864" y="303">Whole repo reviewed,</text>
  <text class="t-small" x="864" y="319">then shipped</text>
  <g>
    <rect class="stamp" x="848" y="352" width="128" height="30" rx="15"/>
    <circle class="hb" cx="863" cy="367" r="11"/><use href="#human" x="855" y="359" width="16" height="16"/>
    <text class="t-stamp" x="880" y="371">You approve</text>
  </g>

  <path class="flow" d="M1006,290 H1036" marker-end="url(#m-flow)"/>

  <!-- 5. Retrospect -->
  <rect class="box" x="1044" y="150" width="134" height="180" rx="8"/>
  <g>
    <rect class="mini" x="1054" y="162" width="114" height="66" rx="4"/>
    <line class="ticket-line" x1="1062" y1="171" x2="1100" y2="171"/>
    <line class="axis" x1="1062" y1="218" x2="1130" y2="218"/>
    <rect class="rbar" x="1064" y="184" width="9" height="34" rx="1.5"/>
    <rect class="rbar" x="1077" y="190" width="9" height="28" rx="1.5"/>
    <rect class="rbar" x="1090" y="194" width="9" height="24" rx="1.5"/>
    <rect class="rbar" x="1103" y="201" width="9" height="17" rx="1.5"/>
    <rect class="rbar-now" x="1116" y="205" width="9" height="13" rx="1.5"/>
    <polyline class="trend" points="1068.5,180 1081.5,187 1094.5,191 1107.5,198 1120.5,202"/>
    <circle class="trend-dot" cx="1120.5" cy="202" r="2.6"/>
    <text class="t-kpi" x="1149" y="200" text-anchor="middle">−32%</text>
    <text class="t-kpi-label" x="1149" y="213" text-anchor="middle">rework</text>
  </g>
  <g><circle class="ab" cx="1172" cy="152" r="15"/><use href="#agent" x="1162" y="142" width="20" height="20"/></g>
  <text class="t-title" x="1058" y="254">Retrospect</text>
  <text class="t-small" x="1058" y="274">An agent reports</text>
  <text class="t-small" x="1058" y="290">duration, tokens</text>
  <text class="t-small" x="1058" y="306">and rework of every</text>
  <text class="t-small" x="1058" y="322">step, with trends</text>
  <g>
    <rect class="stamp" x="1044" y="352" width="128" height="30" rx="15"/>
    <circle class="hb" cx="1059" cy="367" r="11"/><use href="#human" x="1051" y="359" width="16" height="16"/>
    <text class="t-stamp" x="1076" y="371">You choose</text>
  </g>

  <!-- Actors -->
  <rect class="actor-card-you" x="20" y="482" width="574" height="88" rx="10"/>
  <circle class="hb" cx="64" cy="526" r="26"/><use href="#human" x="46" y="508" width="36" height="36"/>
  <text class="t-actor-you" x="104" y="516">You</text>
  <text class="t-actor" x="104" y="540">Describe the idea, and approve the tickets, the plan,</text>
  <text class="t-actor" x="104" y="558">each merge and the release. Choose what to improve.</text>

  <rect class="actor-card-agent" x="606" y="482" width="574" height="88" rx="10"/>
  <circle class="ab" cx="650" cy="526" r="26"/><use href="#agent" x="632" y="508" width="36" height="36"/>
  <text class="t-actor-agent" x="690" y="516">Agents</text>
  <text class="t-actor" x="690" y="540">Write the tickets, plan the order, build several at once,</text>
  <text class="t-actor" x="690" y="558">review each other's work and report what it cost.</text>

  <!-- Shared board -->
  <rect class="band" x="20" y="586" width="1160" height="44" rx="8"/>
  <text class="t-band" x="600" y="613" text-anchor="middle">The board lives on a branch of your repository. Everyone who clones it sees the same tickets, plans and runs.</text>
</svg>
