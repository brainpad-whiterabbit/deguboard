id: software-development
name: Software Development
labels:
  review: Code Review
transitions:
  - from: todo
    to: in_progress
    requires:
      - deps_done
reconcile:
  - when:
      - pr_merged
    status: done
  - when:
      - branch_merged
    status: done
  - when:
      - pr_open
      - "!pr_draft"
    status: review
  - when:
      - branch_exists
    status: in_progress
fields:
  - id: estimate
    type: number
    label: Estimate
steps:
  - id: investigate
    label: Investigate
    actions: []
    approval: false
  - id: implement
    label: Implement
    actions:
      - create_worktree
      - create_branch
      - run_tests
      - create_pr
    approval: false
  - id: review
    label: Review
    actions:
      - run_tests
    approval: false
  - id: fix
    label: Fix
    actions:
      - run_tests
    approval: false
  - id: merge
    label: Merge
    actions:
      - merge_pr
    approval: true
