# Release を公開したときに、その Release に添付した VSIX を VS Code Marketplace と Open VSX に出す（t825）。
# build と検査は回さない。出すのは手元で `mise run check` などを通して作り、Release に添付した VSIX そのもの
# （判断は docs/adr/ADR-008-tech-stack.md、手順は docs/development.md の「リリース」）。
# Marketplace の trusted publishing の policy はこのファイル名（publish-extension.yml）を指すので、名前を変えるときは policy も直す。
name: publish-extension

on:
  release:
    types: [published]

permissions: {}

jobs:
  marketplace:
    # pre-release の Release は出さない
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      # gh で Release の添付を落とす
      contents: read
      # vsce publish --oidc が Marketplace と引き換える OIDC のトークンを求める（PAT は使わない）
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Release の VSIX を落とし、版がタグと合うか確かめる
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern deguboard-vscode.vsix
          version=$(unzip -p deguboard-vscode.vsix extension/package.json | jq -r .version)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::VSIX version $version does not match tag $TAG"
            exit 1
          fi
      - name: Marketplace に出す
        # vsce の版は packages/vscode/package.json の devDependencies と揃える
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath deguboard-vscode.vsix

  open-vsx:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # id-token は渡さない（要るのは Marketplace の job だけ）。Open VSX へは secret のトークンだけで出す
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Release の VSIX を落とし、版がタグと合うか確かめる
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern deguboard-vscode.vsix
          version=$(unzip -p deguboard-vscode.vsix extension/package.json | jq -r .version)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::VSIX version $version does not match tag $TAG"
            exit 1
          fi
      - name: Open VSX に出す
        env:
          # ovsx は OVSX_PAT からトークンを読む
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.4.0 publish deguboard-vscode.vsix
