default_project: default
git:
  remote: origin
  base_branch: main
actor:
  human_only: []
auto:
  merge: true
metrics:
  read_transcripts: true
lint:
  require_iteration: true
models:
  light: haiku
  standard: opus
  heavy: fable
merge:
  method: squash
  delete_branch: true
actions:
  shell: false
  test:
    - '["mise"'
    - '"run"'
    - '"check"]'
  light_test:
    - mise
    - run
    - check:light
  light_paths:
    - docs/**
    - CLAUDE.md
    - SECURITY.md
    - README.ja.md
    - packages/vscode/images/**
    - packages/vscode/media/icon.png
    - packages/vscode/media/deguboard.svg
worktree:
  root: ../<repo>.worktrees
  setup:
    - mise
    - run
    - setup
guide:
  notes:
    overview: ""
    import: ""
    assign: ""
    check: ""
    plan: ""
    work: docs/work-notes.md
    run: ""
    parallel: ""
    review: ""
    audit: ""
    release: ""
    done: ""
    change: ""
    discuss: ""
    status: ""
    all: ""
commit:
  mode: each
