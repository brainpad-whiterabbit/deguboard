git:
  remote: origin
  base_branch: main
actor:
  human_only: []
auto:
  merge: true
  decisions:
    - assign
    - check
    - plan
metrics:
  read_transcripts: true
lint:
  require_iteration: true
models:
  light: haiku
  standard: opus
  heavy: fable
merge:
  method: squash
  delete_branch: true
actions:
  shell: false
  test:
    - mise
    - run
    - check
  light_test:
    - mise
    - run
    - check:light
  light_paths:
    - docs/**
    - CLAUDE.md
    - SECURITY.md
    - README.ja.md
    - packages/vscode/images/**
    - packages/vscode/media/icon.png
    - packages/vscode/media/deguboard.svg
worktree:
  root: ../<repo>.worktrees
  setup:
    - mise
    - run
    - setup
guide:
  notes:
    overview: ""
    import: ""
    assign: ""
    check: ""
    plan: ""
    work: ""
    run: ""
    parallel: ""
    review: ""
    audit: ""
    release: ""
    done: ""
    change: ""
    discuss: ""
    status: ""
    retro: ""
    all: ""
commit:
  mode: each
work:
  parallel: 5
retro:
  perspectives:
    outcome:
      name: 成果
      question: 目標は達成できたか。終えたもの・やめたもの・持ち越したものは何か
      metrics:
        done-rate:
          definition: 閉じた時点で Iteration にあったチケットのうち、done の割合（completed ÷ (completed + carried_over)）
          sources:
            - dg iteration show <S> (completed, carried_over)
          unmeasured: 目標の文そのものを達成できたか
    review:
      name: 見直しの効き目
      question: 見直しは不具合をマージの前に見つけ、少ない回数で収束したか
      metrics:
        heavy-per-reviewed:
          definition: 見直しの記録が 1 件以上あるチケット 1 件あたりの重い指摘の数（reviews.heavy の合計 ÷ reviews.recorded が 1 以上のチケットの数）
          sources:
            - dg metrics show --iteration <S> --by ticket (reviews.heavy, reviews.recorded)
          unmeasured: マージの後に見つかった不具合
        first-pass-rate:
          definition: 見直しの記録が 1 件以上あるチケットのうち、見直しが 1 回だけで通ったもの（reviews.recorded が 1 で reviews.passed が 1）の割合
          sources:
            - dg metrics show --iteration <S> --by ticket (reviews.recorded, reviews.passed)
          unmeasured: 通った見直しが不具合を見落としていなかったか
        rounds-per-reviewed:
          definition: 見直しの記録が 1 件以上あるチケット 1 件あたりの見直しの回数（reviews.recorded の合計 ÷ そのチケットの数）。1 件のチケットの最大の回数とそのチケットの ID を添える
          sources:
            - dg metrics show --iteration <S> --by ticket (reviews.recorded)
          unmeasured: 回数が多かった原因（チケット・実装・見直しのどれか）
    spec:
      name: 仕様の質
      question: チケット（受け入れ条件と範囲）は、作り直しなしで通る成果を引き出せたか
      metrics:
        ticket-caused-rework-rate:
          definition: Run のあるチケットのうち、手直しの理由（fix Run の retry_reasons）か、重い指摘のあった PR のレビューコメントに、原因が「チケット」（受け入れ条件か範囲があいまい・抜けていた）に当たるものが 1 件以上あるチケットの割合。原因の分け方は dg guide retro の「Causes of rework」に従い、理由の書かれていない手直しは測れないものとして件数を添える
          sources:
            - dg metrics show --iteration <S> --by ticket (retries, reviews.heavy)
            - dg run list --ticket <t> (step=fix の retry_reasons)
            - gh pr view <PR> --json reviews,comments（重い指摘のあったチケットの PR）
          unmeasured: 見直しで指摘されなかったチケットの不備（実装者が補って通ったもの）と、マージの後に見つかった不備
    slicing:
      name: 分け方
      question: 作業は、互いにぶつからずに並べて進められる大きさと境目に分けられたか
      metrics:
        size-spread:
          definition: 変更行（additions + deletions）が 1 行以上あるチケットの、変更行の最大 ÷ 中央値（個数が偶数のときは小さい側の中央の値）
          sources:
            - dg metrics show --iteration <S> --by ticket (lines.additions, lines.deletions)
          unmeasured: PR どうしがぶつかったか
    stability:
      name: エージェントの安定
      question: エージェントの働きは、失敗・中断・やり直しなく安定して終わったか
      metrics:
        failed-run-rate:
          definition: Run のうち、failure か interrupted で終わったものの割合（(results.failure + results.interrupted) ÷ runs）
          sources:
            - dg metrics show --iteration <S> (total.results, total.runs)
          unmeasured: 失敗のない Run の中で起きた遠回り
    cost:
      name: コスト
      question: 時間とトークンはどこに使われ、成果に見合っていたか
      metrics:
        tokens-per-line:
          definition: 変更行 1 行あたりのトークン。output と input_cache を分けて示し、足し合わせない。変更行のないチケットの数（lines.missing）を添える
          sources:
            - dg metrics show --iteration <S> (total.lines.per_line, total.lines.missing)
          unmeasured: 成果の値打ちに見合っていたか
    improvement:
      name: 改善の追跡
      question: 前の振り返りの Try は終わり、ねらった数字は動いたか
      metrics:
        prev-try-done-rate:
          definition: 前の振り返りの retro-<前の S> のラベルのチケットのうち、done の割合（abandoned も分母に入れる）
          sources:
            - dg ticket list --label retro-<前の S> --include-abandoned (status)
          unmeasured: 狙った数字が動いたか（Try の本文の数字と見比べる）
default_workflow: software-development
