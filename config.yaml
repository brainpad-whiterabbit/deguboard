default_project: default
git:
  remote: origin
  base_branch: main
actor:
  human_only: []
auto:
  merge: true
metrics:
  read_transcripts: true
lint:
  require_iteration: true
models:
  light: haiku
  standard: haiku
  heavy: opus
merge:
  method: squash
  delete_branch: true
actions:
  shell: false
  test:
    - mise
    - run
    - check
worktree:
  root: ../<repo>.worktrees
  setup:
    - mise
    - run
    - setup
