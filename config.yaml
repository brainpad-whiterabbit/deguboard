default_project: default
git:
  remote: origin
  base_branch: main
actor:
  human_only: []
auto:
  merge: true
  decisions:
    - assign
    - check
    - plan
metrics:
  read_transcripts: true
lint:
  require_iteration: true
models:
  light: haiku
  standard: opus
  heavy: fable
merge:
  method: squash
  delete_branch: true
actions:
  shell: false
  test:
    - mise
    - run
    - check
  light_test:
    - mise
    - run
    - check:light
  light_paths:
    - docs/**
    - CLAUDE.md
    - SECURITY.md
    - README.ja.md
    - packages/vscode/images/**
    - packages/vscode/media/icon.png
    - packages/vscode/media/deguboard.svg
worktree:
  root: ../<repo>.worktrees
  setup:
    - mise
    - run
    - setup
guide:
  notes:
    overview: ""
    import: ""
    assign: ""
    check: ""
    plan: ""
    work: ""
    run: ""
    parallel: ""
    review: ""
    audit: ""
    release: ""
    done: ""
    change: ""
    discuss: ""
    status: ""
    retro: ""
    all: ""
commit:
  mode: each
work:
  parallel: 5
retro:
  perspectives:
    outcome:
      name: 成果
      question: 目標は達成できたか。終えたもの・やめたもの・持ち越したものは何か
      metrics:
        done-rate:
          definition: 閉じた時点で Iteration にあったチケットのうち、done の割合（completed ÷ (completed + carried_over)）
          sources:
            - dg iteration show <S> (completed, carried_over)
          unmeasured: 目標の文そのものを達成できたか
    review:
      name: 見直しの効き目
      question: 見直しは不具合をマージの前に見つけ、少ない回数で収束したか
      metrics:
        heavy-per-reviewed:
          definition: 見直しの記録が 1 件以上あるチケット 1 件あたりの重い指摘の数（reviews.heavy の合計 ÷ reviews.recorded が 1 以上のチケットの数）
          sources:
            - dg metrics show --iteration <S> --by ticket (reviews.heavy, reviews.recorded)
          unmeasured: マージの後に見つかった不具合
    spec:
      name: 仕様の質
      question: チケット（受け入れ条件と範囲）は、作り直しなしで通る成果を引き出せたか
      metrics:
        clean-ticket-rate:
          definition: Run のあるチケットのうち、retries が 0 で reviews.heavy も 0 のものの割合
          sources:
            - dg metrics show --iteration <S> --by ticket (retries, reviews.heavy)
          unmeasured: 手戻りの原因がチケットにあったか
    slicing:
      name: 分け方
      question: 作業は、互いにぶつからずに並べて進められる大きさと境目に分けられたか
      metrics: {}
    stability:
      name: エージェントの安定
      question: エージェントの働きは、失敗・中断・やり直しなく安定して終わったか
      metrics: {}
    cost:
      name: コスト
      question: 時間とトークンはどこに使われ、成果に見合っていたか
      metrics: {}
    improvement:
      name: 改善の追跡
      question: 前の振り返りの Try は終わり、ねらった数字は動いたか
      metrics: {}
