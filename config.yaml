default_project: default
git:
  remote: origin
  base_branch: main
actor:
  human_only: []
auto:
  merge: true
metrics:
  read_transcripts: true
lint:
  require_iteration: true
models:
  light: haiku
  standard: haiku
  heavy: opus
merge:
  method: squash
  delete_branch: true
actions:
  shell: false
  test:
    - mise
    - run
    - check
  light_test:
    - mise
    - run
    - check:light
  light_paths:
    - docs/**
    - CLAUDE.md
    - SECURITY.md
    - packages/vscode/images/**
    - packages/vscode/media/icon.png
    - packages/vscode/media/deguboard.svg
worktree:
  root: ../<repo>.worktrees
  setup:
    - mise
    - run
    - setup
