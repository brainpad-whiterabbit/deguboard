# 開発に必要なツールの版。作業のコマンドは mise run <task> に統一する（docs/adr/ADR-008-tech-stack.md）
[tools]
node = "24.22.2"
pnpm = "12.12.1"

# タスクは pnpm scripts を呼ぶだけにする。人もエージェントも mise run だけを使う
[tasks.install]
description = "依存を lockfile どおりに入れ、dist と VSIX をビルドし、VSIX を VS Code に入れる（dg と拡張が変更前のまま残らないように。code CLI がなければ導入は飛ばす）"
run = ["pnpm install --frozen-lockfile", "pnpm run build", "pnpm run vsix", "pnpm run vsix:install"]

[tasks.format]
description = "oxfmt でコードと設定ファイルの書式を整える"
run = "pnpm run format"

[tasks."format:check"]
description = "書式が整っているかを確かめる（書き換えない）"
run = "pnpm run format:check"

[tasks.lint]
description = "oxlint を実行する"
run = "pnpm run lint"

[tasks.typecheck]
description = "tsc で型を検査する"
run = "pnpm run typecheck"

[tasks.test]
description = "vitest でテストする"
run = "pnpm run test"

[tasks."test:layout"]
description = "画面の配置とドラッグを Chromium で確かめる（サイドバーの幅 300px・260px、ライトとダーク、バックログの区画の間のドラッグ）。ブラウザが要るので check には入れない（先に mise run playwright:install）"
depends = ["build"]
run = "pnpm run test:layout"

[tasks.build]
description = "core・server・cli を tsc で、web と vscode を Vite で dist にビルドする（dg を動かすのに要る）"
run = "pnpm run build"

[tasks.vsix]
description = "VS Code 拡張を packages/vscode/deguboard-vscode.vsix に固める（先に build が要る）"
depends = ["build"]
run = "pnpm run vsix"

[tasks."vsix:install"]
description = "ビルド済みの VSIX を VS Code に入れる（同じ版でも --force で差し替える。code CLI がなければ飛ばす。入れたあとはウィンドウの再読み込みが要る）"
depends = ["vsix"]
run = "pnpm run vsix:install"

[tasks."playwright:install"]
description = "Playwright MCP（.mcp.json）が使う Chromium を入れる（版は @playwright/mcp が使う playwright-core に合わせて固定）"
run = "pnpm run playwright:install"

[tasks.pack]
description = "公開する 3 パッケージ（core・server・cli）の tarball を release/ に作る（先に build が要る）"
depends = ["build"]
run = "pnpm run pack"

[tasks."release:version"]
description = "全パッケージの版を揃える。例: mise run release:version -- 0.1.0"
run = "pnpm run release:version"

[tasks."release:publish"]
description = "core・server・cli を npm に公開する（main の clean な状態で。npm login が要る）"
run = "pnpm run release:publish"

[tasks.dg]
description = "ビルド済みの dg を動かす。例: mise run dg -- ticket list"
run = "pnpm run dg"

[tasks."check:docs"]
description = "文書の大きさの予算と ADR 一覧の整合を検査する"
run = "pnpm run check:docs"

[tasks.check]
description = "コミット前の確認。書式・lint・型・テスト・文書を順に検査する"
run = [
  "pnpm run format:check",
  "pnpm run lint",
  "pnpm run typecheck",
  "pnpm run test",
  "pnpm run check:docs",
]
