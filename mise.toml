# 開発に必要なツールの版。作業のコマンドは mise run <task> に統一する（docs/adr/ADR-008-tech-stack.md）
# mise 自体の版はここでは固定しない。公開のワークフローが使う mise の版は .github/workflows/publish-extension.yml の
# env.MISE_VERSION にだけ書く。このファイルに新しい mise でしか読めない書き方を足したら、その版も上げる
[tools]
node = "24.22.2"
pnpm = "12.12.1"

# タスクは pnpm scripts を呼ぶだけにする。人もエージェントも mise run だけを使う
[tasks.setup]
description = "依存を lockfile どおりに入れ、dist をビルドする（VS Code に拡張は入れない。worktree の用意はこれ）"
run = ["pnpm install --frozen-lockfile", "pnpm run build"]

[tasks.install]
description = "依存を lockfile どおりに入れ、dist と VSIX をビルドし、VSIX を VS Code に入れる（dg と拡張が変更前のまま残らないように。main の checkout で使い、worktree では setup。code CLI がないか上限までに答えなければ導入は飛ばす）"
run = ["pnpm install --frozen-lockfile", "pnpm run build", "pnpm run vsix", "pnpm run vsix:install"]

# .oxfmtrc.json で guide-*.md を整形の対象から外す。表の列をそろえる空白を入れないため。guide の表のセルは短く、表は手で書く（ADR-001）
[tasks.format]
description = "oxfmt でコードと設定ファイルの書式を整える"
run = "pnpm run format"

[tasks."format:check"]
description = "書式が整っているかを確かめる（書き換えない）"
run = "pnpm run format:check"

[tasks.lint]
description = "oxlint を実行する"
run = "pnpm run lint"

[tasks.typecheck]
description = "tsc で型を検査する"
run = "pnpm run typecheck"

[tasks.test]
description = "vitest でテストする"
run = "pnpm run test"

[tasks."test:related"]
description = "作業の途中に、変えたファイルに関わるテストだけを vitest で回す。変えたファイルは origin/main からの差分（コミット済み・ステージ・未ステージ・未追跡）で、関わるテストは import でたどれるテストと変えたテストファイル。関わるテストがなければ何も回さずに成功する。全体は mise run test、コミットの前は mise run check"
run = "pnpm run test:related"

[tasks."test:layout"]
description = "画面の配置と吹き出しの一覧を Chromium で確かめる（サイドバーとパネルの幅、ライトとダーク、カンバン・バックログ・Iteration の詳細の吹き出しの一覧。中身は test/layout/）。ブラウザが要るので check には入れない（先に mise run playwright:install）"
depends = ["build"]
run = "pnpm run test:layout"

[tasks."test:vscode"]
description = "VS Code の実機（拡張開発ホスト）で左パネルの Webview を確かめる（チケットの行・詳細のパネル・CSP 違反と例外の検出・ライトとダークのスクリーンショットを test/vscode/screenshots/ に出す。中身は test/vscode/）。VS Code 本体を .vscode-test/ に落とし、画面がなければ Xvfb を起動するので check には入れない"
depends = ["build"]
run = "pnpm run test:vscode"

[tasks.build]
description = "core・server・cli を tsc で、web と vscode を Vite で dist にビルドする（dg を動かすのに要る）"
run = "pnpm run build"

[tasks.vsix]
description = "VS Code 拡張を packages/vscode/deguboard-vscode.vsix に固め、その SHA256 と Release の本文に貼る文を出す（build を先に走らせる。拡張の README はルートの README.md の全文を写して作り、相対リンクがあれば失敗する）"
depends = ["build"]
run = "pnpm run vsix"

[tasks."vsix:install"]
description = "ビルド済みの VSIX を VS Code に入れる（ビルドはしないので先に mise run vsix。同じ版でも --force で差し替える。code CLI がないか、上限（DEGUBOARD_VSIX_INSTALL_TIMEOUT_MS、既定 60 秒）までに答えなければ、手で入れるコマンドを出して飛ばす。入れたあとはウィンドウの再読み込みが要る）"
run = "pnpm run vsix:install"

[tasks."playwright:install"]
description = "Playwright MCP（.mcp.json）と test:layout・gifs が使う Chromium を入れる（版は @playwright/mcp が使う playwright-core に合わせて固定）"
run = "pnpm run playwright:install"

[tasks.gifs]
description = "README の GIF（packages/vscode/images/ の import・assign・plan・work・retro の 5 本）を、英語の表示（README.md の *.gif）と日本語の表示（README.ja.md の *.ja.gif）の両方で録り直す。一時リポジトリの dg serve の左パネルを Chromium で操作し、ターミナルを模した外枠で dg のコマンドを流して撮る（台本と外枠は scripts/record-gifs.mjs）。1140px 幅（plan・work は左パネルを広げて 1245px 幅）で撮る。20 秒以下・1MB 以下に収まらなければ失敗する。mise run gifs -- work.gif work.ja.gif のように名前を渡せばその分だけ録る（知らない名前は失敗）。先に mise run playwright:install"
depends = ["build"]
run = "pnpm run gifs"

[tasks."release:version"]
description = "全パッケージの版を揃える。例: mise run release:version -- 0.10.0"
run = "pnpm run release:version"

[tasks.audit]
description = "本番の依存（pnpm audit --prod）に既知の脆弱性がないか検査する。脆弱性があれば失敗する。ネットワークが要るので check には入れず、リリースの手順で実行する"
run = "pnpm run audit"

[tasks.dg]
description = "ビルド済みの dg を動かす。例: mise run dg -- ticket list"
run = "pnpm run dg"

[tasks."dg:link"]
description = "dg を ~/.local/bin/dg にリンクし、PATH に通す手順を案内する（端末からほかのリポジトリでも dg を呼ぶときに使う。リンクした dg は PATH の node で動くので、node 24 以上が要る。古いと英語で止まる。mise run dg -- は mise.toml の node を使う。フックは mise run dg -- hooks install が絶対パスで書くので要らない）。clone ごとに一度（build を先に走らせる）"
depends = ["build"]
run = "pnpm run link:dg"

[tasks."check:docs"]
description = "文書の重複と参照の切れを検査する。guide の節の重複・文書どうしの同じ段落・ADR 一覧の整合と「最後に使った番号」・文書とコードの ADR 番号の実在・packages・scripts・test の ADR 番号が先頭のコメントの外にないことと、先頭のコメントの異なる番号が 2 つ以上ないこと（ADR 番号を検査するテストと check-docs 自身だけ例外）・8,000 字を超える ADR の警告（落とさない）・リンクとアンカーの切れ・拡張と Walkthrough が指す README の見出し・README.ja.md の節の構成のずれ・コードの要件 ID と先頭コメントの参照・要件の 1 項の上限（250 字）・コードとテストが指す置き換え済みの ADR・文書と packages の .ts・.tsx の文字列とコメントの「dg guide <topic> の「節」」と英語の「the \"節\" section of dg guide <topic>」の参照（guide の見出し（括弧の補足を除いた名前を含む）と、節の中の太字の項目・一覧の先頭のコードと照らす）"
run = "pnpm run check:docs"

# 軽い検査は文書を読むテストも回す。文書のテスト（check-docs.test.ts）は実際の docs・CLAUDE.md の値を確かめるので、
# 文書だけの PR で check を落とさないように、そのテストを軽い検査に入れる（テストの値を写したファイルに替えるより、同じ入力で確かめる方を選んだ）
[tasks."check:light"]
description = "軽い検査。書式と文書の検査と、文書を読むテスト（test:docs）を回す。変更が config の actions.light_paths に入るファイル（文書・アセット）だけのとき、check の代わりにコミットの前と品質ゲート（actions.light_test）で回す"
run = ["pnpm run format:check", "pnpm run check:docs", "pnpm run test:docs"]

[tasks."test:docs"]
description = "文書を読むテスト（test/scripts/check-docs.test.ts）だけを回す。実際の docs・CLAUDE.md・README を写して、check:docs の検査とテストの期待の値が合うかを確かめる。軽い検査（check:light）にも入っている"
run = "pnpm run test:docs"

# テストの段（test:locked）は、別の worktree の全体のテストと重ならないように lock を取ってから回す。
# lock の処理と理由は scripts/test-locked.sh
[tasks.check]
description = "コミット前の確認。書式・lint・型・テスト・文書を順に検査する。テストの段だけは、別の worktree の全体のテストと CPU を取り合って遅くなり落ちないように、git-common-dir の下の lock を flock で取ってから回す（取れなければ lock の場所を 1 行出して待つ。flock がないか lock を作れなければ lock なしで回す）"
run = [
  "pnpm run format:check",
  "pnpm run lint",
  "pnpm run typecheck",
  "pnpm run test:locked",
  "pnpm run check:docs",
]
