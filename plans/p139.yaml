    approach: Stop reading and respond with the status and English message, then close after the response finishes
    tier: standard
  t978:
    scope: Remove the obsolete snapshots reported by guide.test.ts
    approach: Run the file alone, confirm each obsolete snapshot has no current test, and remove them with the snapshot update
