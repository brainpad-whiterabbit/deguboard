  t180:
    scope: 左パネルの節の見出しを大文字にせず、Done・中止の件数を数字だけにし、実行計画の帯の見出しを同じ形にそろえる
    approach: Column と styles.css の text-transform とバッジの出し分けを直し、帯の見出しは t179 の後の形に合わせる
  t182:
    scope: 開いた Plan で待ちの相手が残るか承認待ちの todo の行のタイトルを説明文の色にし、UI-2 を直す
    approach: kanbanPlanMarks・rowActivity の結果から Card に薄くする class を付け、色は styles.css のトークンで出す
  t181:
    scope: 行の担当の名前の列を右端の印にし、agent は持ち主の丸と種類のアイコンにする。チケットごとの agent の種類を core の出力に載せる
    approach: core のチケットの一覧の出力に Run から引いた agent の種類を足して CLI・HTTP・Webview に写し、KanbanRowEnd に印を置き、公式アイコンを同梱する
