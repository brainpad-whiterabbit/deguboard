  t177:
    scope: 左パネルの見出し（SidebarBoardHead）の Project の段・漏斗の絞り込みと札・件数の削除と UI-2。広い画面は変えない
    approach: board.tsx の SidebarBoardHead と styles.css で直し、絞り込みの開閉は Webview の状態に持つ
  t179:
    scope: 実行計画の帯（plan-band.tsx）を Plan ごとの 2 行と Plan ごとのグラフの開閉にし、閉じた計画をまとめ、UI-2 を直す
    approach: board.plansExpanded をやめて Plan ごとの開閉を ui-state に覚え、PlanLine と PlanGraphView を組み直す
