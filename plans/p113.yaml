  t799:
    scope: check のテストの段の lock をスクリプトに移し、その振る舞いをテストで守る
    approach: scripts/ に lock のスクリプトを置き package.json の script から呼び、mise.toml はその script を 1 つ呼ぶだけにする。lock の場所は絶対パスにし、作れないときは lock なしで回す
    tier: standard
  t802:
    scope: conflict_fields が空の競合で止まった dg sync の警告を、手で解く手順にする。README・guide を合わせる
    approach: sync の警告を組み立てるところで conflict_fields の有無で CONFLICT_REMEDY と UNRESOLVABLE_REMEDY を選び分ける
    tier: standard
  t803:
    scope: Stop の速い経路の写し・通らない行・describe の位置を片付け、本体に回す前提を示す
    approach: remote の名前の決め方を storage/remote-name.ts に寄せ、context.ts と fast-hook.ts の両方がそこを使う
    tier: standard
  t804:
    scope: dg の Skill の無視の行と追跡の警告を dg が入れる名前だけにし、hooks uninstall が行を残すことを示し、AG-2 に正本への案内を足す
    approach: 入れる Skill の名前の一覧から名前ごとの無視の行を作り、このリポジトリの .claude/.gitignore も直す
    tier: standard
