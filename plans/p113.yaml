    approach: 値を読む関数を vitest.config.ts から切り出してテストし、受ける形を示すエラーを投げる
    tier: standard
  t806:
    scope: vite を 8.3.8 以上に上げ、README.ja.md の Security の節の SECURITY.md を絶対の URL にそろえる
    approach: web と vscode の vite を上げて lock を更新し、README.ja.md の 1 行を直す
    tier: light
  t805:
