  t915:
    scope: 見直しの指摘に 7 種類の cause を足し、見直しの Run に重い・軽いの原因ごとの数を残し、metrics show で合計する
    approach: reviewFindingSchema に cause の enum を足して review-result で検証し、reviewOfFindings で原因ごとに数えて runReviewSchema に入れ、metrics で合計して前の Run を missing に数える。ADR-029 と RN の項を直す
