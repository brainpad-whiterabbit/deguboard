    approach: Claude Code の会話記録の tool_result の is_error を tool_use の id で重ねずに数えて tallyTools に渡し、取れないエージェントと前の Run は missing にする。結果の中身が Git に入らないことをテストで示し、ADR-029 と RN-1・MT の項を直す
