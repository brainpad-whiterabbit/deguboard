    approach: core のコマンド定義に足して CLI・HTTP・Webview に写し、requirements.md を直す
  t162:
    scope: 左パネルのバックログの行の右クリックで Iteration を移す・詳細を開く・ID をコピーを出す
    approach: vscode の webview/context メニューと data-vscode-context を使い、移すのは core の ticket.update を呼ぶだけ
