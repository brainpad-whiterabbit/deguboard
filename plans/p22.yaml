details:
  t167:
    scope: plan.show（と plan.list）に待ちの相手・着手可・次の順を載せ、web の帯と行の印・guide-work・requirements をそれに揃える
    approach: core の plan コマンドで計算し、web の waitingOn・remainingWaits・planState を消して読むだけにする。消したチケットの after は待ちから外す側に揃える
  t244:
    scope: 8 本の ADR の決定から正本のある細部を消すか参照にし、ADR-003・004・006・007 を予算の 90% 未満にする
    approach: 細部ごとに requirements・ヘルプ・guide に同じ内容があるか確かめてから消す。足りなければ正本の側へ移す
  t240:
    scope: ticket import の readDrafts で本文の項目の行末コメントと構文エラーを INVALID_INPUT にし、guide-import に書き方を足す
    approach: parseDocument で読み、本文の項目のスカラーの comment を見て UsageError を投げる。cli のテストを足す
  t242:
    scope: guide-work の「PR の要らない作業」の手順 1 に、上の手順 1 への参照と今の設定の値を足す
    approach: 選び方は書き写さず参照だけにし、guide.test.ts で順と値の埋め込みを確かめる
  t196:
    scope: guide-review の「合う step がない」と guide-work:39 を --file で steps を足す案内に直し、consulting の fix の扱いを決めて反映する
    approach: consulting のテンプレートには fix を足さず、伝える対象を fix を持たない Workflow から外す方向で guide に書く
  t237:
    scope: 選んだ Iteration の札の code の色を inherit にする CSS だけ
    approach: "styles.css の .iteration-chip[aria-pressed=true] code に color: inherit を足し、スクリーンショットを PR に載せる"
  t238:
    scope: バックログの行に PriorityBadge を出し、priority-mark と low の区切りを消す
    approach: BacklogRowEnd に PriorityBadge を足し、TicketTable の priorityMarks と CSS とテストを直す。ライトとダークのスクリーンショットを載せる
  t209:
    scope: Run を読み終えるまで待ちの行を薄くしない
    approach: runningTickets が null の間は dimmed を false にし、app.test.tsx の run.list を止める形のテストで前後を確かめる
  t243:
    scope: カンバン・Run・履歴のタブの行き先を nav.<page> の最後に見たハッシュにまとめる
    approach: app.tsx の NAV を useUiState で引く形に揃え、Project 違い・閉じた Iteration と Epic は既定に戻す。web のテストを足す
  t186:
    scope: web の done・abandoned の並べ書きを isFinished、core を isTerminal にまとめる。表示は変えない
    approach: t167 の後の plan-graph.ts から始め、挙げた箇所を置き換えて grep で残りがないことを確かめる
  t245:
    scope: 各 ADR の採らなかった案を、また提案されそうな案の 1 行の理由に絞る
    approach: t244 の後の ADR で節だけを直し、消した案に触れる文が残らないことを確かめる
  t204:
    scope: 受け入れ条件の 6 項目（担当の印・Run の見分け・exists・フィルタ・文脈名と通知名・進みの件数）を片付ける
    approach: core に寄せられるものは core に定数・関数を置いて web・vscode が読み、写しにするものはテストで固定する
  t210:
    scope: check-docs に ADR の更新日の一致を足し、版の固定の設定と development.md の pack の案内を直す
    approach: scripts/check-docs.mjs に検査を足し、pnpm-workspace.yaml に savePrefix を入れ、development.md を mise run pack にする
  t168:
    scope: active の Iteration を 1 つに限り、start・reopen・カンバン・手順・requirements・ADR を揃える
    approach: iteration start と reopen はほかに active があれば拒否し、先に閉じるよう案内する。IT-1 に書き、理由は予算に余裕のある ADR に置く
  t235:
    scope: actions.*・actor.human_only を保存の前に確かめる項目に足し、UI-14・ADR-006・CONFIRM_KEYS・テストを揃える
    approach: ADR-007 が actions.test をシェルの許可と同等とみなすので確かめる側に決め、ADR-006 は置き換える形で書く
  t246:
    scope: t244・t245 の後の ADR の大きさを測り、2 テーマに育った ADR があれば分ける
    approach: 測った結果で判断し、分けないなら claim --without-branch で判断をチケットに記録して終える
