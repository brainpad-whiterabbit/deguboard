pending_approval: true
details:
  t827:
    scope: 拡張の name を deguboard に、CLI のパッケージ名を @deguboard/cli に変え、参照する script・設定・文書を合わせる。VSIX のファイル名は変えない
    approach: package.json の name と pnpm --filter・install-vsix・vsix-sha256 の参照を grep で洗い出して置き換え、build・vsix・check で確かめる
    tier: standard
  t858:
    scope: 入れてある dg の Skill が同梱のものと違うかの判定を作り、hooks check・next・brief の警告に出す。拡張の更新は t857
    approach: dg skill install の判定（sha256 の印と手で直したかの区別）を core に置いて共有し、CLI の hooks check と next・brief の warnings から呼ぶ
    tier: heavy
  t833:
    scope: リリースと一気通貫の終わりの次の手順に /dgretro を出すか決め、出すなら guide と guide のテストを直す
    approach: guide-release.md と guide-all.md の次の手順を読み、閉じた Iteration の振り返りを勧める選択肢を足すかを決めて guide に書く
    tier: light
  t834:
    scope: 頼むの候補の名前の言語を決め、l10n-core.ts の閉じた e11 を指すコメントを直す
    approach: ADR-001 の英語で書くものの範囲に照らして決め、英語にするなら ask.ts の label を英語にして web の訳をテストで確かめる
    tier: standard
  t828:
    scope: LICENSE の著作権者を deguboard contributors にする。会社の規程の確認は人が行い、結果をチケットに記録する
    approach: 人の確認の結果を待ってから LICENSE と README の License の節を直す
    tier: light
  t825:
    scope: Release の公開で添付の VSIX を Marketplace と Open VSX に出すワークフローを 1 つ置き、ADR-008 と development.md のリリースを直す
    approach: "release: published で走り gh で添付の VSIX を落として vsce publish --oidc と ovsx publish で出す。build と検査は回さない"
    tier: standard
  t857:
    scope: 拡張の起動時に入れてある dg の Skill を同梱の版と比べ、古いものを更新して通知する。入れていない場所には書かない
    approach: t858 の core の判定と skill install の処理を拡張の起動から呼び、更新したものと手で直したものを通知に分けて出す
    tier: standard
  t840:
    scope: 人が初回の VSIX を手で上げ、Marketplace の trusted publishing と Open VSX の secret を設定する。PR は要らない
    approach: development.md のリリースの手順に従って人が行い、受け入れ条件を確かめて done にする
    tier: light
  t826:
    scope: README.md と README.ja.md の導入をストアからのインストールに変え、対応する OS を示す
    approach: 拡張のページの絶対 URL と Open VSX の案内を足し、VSIX を手で入れる方法は残す
    tier: light
